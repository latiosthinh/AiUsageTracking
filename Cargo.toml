[package]
name = "ai-usage-widget"
version = "0.1.0"
edition = "2021"
description = "Tiny always-on-top widget showing Claude and Cursor usage"
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
eframe = "0.32"
tray-icon = "0.26.1"
egui_extras = { version = "0.32", default-features = false, features = ["svg"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
